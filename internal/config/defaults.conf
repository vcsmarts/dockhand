# dockhand default configuration: pickers and aliases.
#
# dockhand is tool-agnostic. It knows nothing about docker or kubectl; every
# alias is a command, and every picker is a command whose output rows are
# offered in a fuzzy finder. Words are split like a shell (quotes work).
#
# ---------------------------------------------------------------------------
# picker <name> [header] [multi] [col=<n|TITLE>] [forward=<flag,...>] <command...>
#
#   header           the first output line is a header; columns are cut at the
#                    header's positions and shown as titles in the picker
#   multi            TAB selects several rows; all are passed as targets
#   col=<n|TITLE>    which column is the target: a 1-based number, or a header
#                    title (needs header). Default: the first column.
#   forward=<flags>  comma-separated flags that, when present in your args,
#                    are also passed to the list command, so
#                    `dockhand kl -n web` lists pods in web
#
#  name                                   options                                        list command
picker  container       header col=NAMES                                             docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}"
picker  container-all   header col=NAMES                                             docker ps -a --format "table {{.Names}}\t{{.Image}}\t{{.Status}}"
picker  service         multi                                                        docker compose ps -a --services
picker  context         header col=NAME                                              kubectl config get-contexts
picker  namespace       header col=NAME forward=--context,--kubeconfig               kubectl get namespaces
picker  pod             header forward=-n,--namespace,--context,--kubeconfig         kubectl get pods
#
# ---------------------------------------------------------------------------
# <name> <picker|none> <command...> [default args]
#
#   <name>     the subcommand you'll type: dockhand <name> [args...]
#   <picker>   a picker defined above, or none
#   <command>  the command that runs. Your extra args are appended, then the
#              picked target(s). Put {} in the command to place the target(s)
#              somewhere else; your extra args then go at the very end.
#              A trailing [group] is used only when you pass no args at all:
#                  dexec  container  docker exec -it {} [sh]
#                      dockhand dexec       ==  docker exec -it <picked> sh
#                      dockhand dexec bash  ==  docker exec -it <picked> bash
#
# To customize, run `dockhand init-config` and edit ~/.config/dockhand/aliases.conf.
# Changes take effect immediately.
#
#  name        picker          command
#  --- docker ---
   dl          container-all   docker logs
   dcl         service         docker compose logs
   dexec       container       docker exec -it {} [sh]
   dstop       container       docker stop
   dps         none            docker ps
   dcps        none            docker compose ps
   dcdown      none            docker compose down
   dcup        none            docker compose up
   dcupd       none            docker compose up -d
   dcrestart   service         docker compose restart
#  --- kubernetes ---
   kctx        context         kubectl config use-context {}
   kns         namespace       kubectl config set-context --current --namespace {}
   kgp         none            kubectl get pods
   kl          pod             kubectl logs
   kd          pod             kubectl describe pod
   kexec       pod             kubectl exec -it {} -- [sh]
   kpf         pod             kubectl port-forward {}
   kdel        pod             kubectl delete pod
