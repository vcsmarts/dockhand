# dockhand default aliases.
#
# Format (whitespace-separated):
#     <name>   <picker>   <command...>  [default args]
#
# <name>     the subcommand you'll type: dockhand <name> [args...]
# <picker>   how to resolve the target, one of:
#                none            no target needed
#                docker          fuzzy-pick one running container (docker ps)
#                docker-all      fuzzy-pick one container, running or stopped (docker ps -a)
#                compose         fuzzy-pick one or more compose services (TAB to multi-select)
#                kube-context    fuzzy-pick one kubectl context
#                kube-namespace  fuzzy-pick one namespace
#                kube-pod        fuzzy-pick one pod; -n/--namespace, --context and
#                                --kubeconfig in your args are honoured by the picker
# <command>  the command that runs. Your extra args are appended, then the
#            picked target(s). Put {} in the command to place the target(s)
#            somewhere else; your extra args then go at the very end.
#            A trailing [group] is used only when you pass no args at all:
#                dexec  docker  docker exec -it {} [sh]
#                    dockhand dexec       ==  docker exec -it <picked> sh
#                    dockhand dexec bash  ==  docker exec -it <picked> bash
#
# Lines starting with # and blank lines are ignored.
# To customize, run `dockhand init-config` and edit ~/.config/dockhand/aliases.conf.
# Changes take effect immediately.
#
#  name        picker          command
#  --- docker ---
   dl          docker-all      docker logs
   dcl         compose         docker compose logs
   dexec       docker          docker exec -it {} [sh]
   dstop       docker          docker stop
   dps         none            docker ps
   dcps        none            docker compose ps
   dcdown      none            docker compose down
   dcup        none            docker compose up
   dcupd       none            docker compose up -d
   dcrestart   compose         docker compose restart
#  --- kubernetes ---
   kctx        kube-context    kubectl config use-context {}
   kns         kube-namespace  kubectl config set-context --current --namespace {}
   kgp         none            kubectl get pods
   kl          kube-pod        kubectl logs
   kd          kube-pod        kubectl describe pod
   kexec       kube-pod        kubectl exec -it {} -- [sh]
   kpf         kube-pod        kubectl port-forward {}
   kdel        kube-pod        kubectl delete pod
